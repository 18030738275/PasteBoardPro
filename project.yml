name: PasteBoardPro
options:
  bundleIdPrefix: com.pasteboardpro
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  PasteBoardPro:
    type: application
    platform: macOS
    sources:
      - PasteBoardPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pasteboardpro.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_FILE: PasteBoardPro/Info.plist
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: GRDB
